name: CI/CD — Processing Service

# Processing Service builds, tests and deploys on its own, independently of the other services
# (SCRUM-72). The environments, the App Services and the publish profiles this workflow uses were
# created by infra/azure/ in SCRUM-70 — see docs/environments.md.

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

  # Manual redeploy, and the rollback path: pick an environment and a known-good commit.
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - staging
          - production
      commit_sha:
        description: 'Commit SHA to deploy (blank = the branch you selected above)'
        required: false
        type: string

permissions:
  contents: read

# A rollback dispatch and an ordinary push must not deploy over each other. cancel-in-progress is
# false so the first one finishes rather than being killed halfway through a deployment.
concurrency:
  group: deploy-${{ github.event.inputs.target_environment || github.ref }}
  cancel-in-progress: false

env:
  SOLUTION: ProcessingService.slnx
  PROJECT_PATH: src/ProcessingService/ProcessingService.csproj
  STAGING_APP: app-wonrich-processing-staging
  PRODUCTION_APP: app-wonrich-processing-prod

jobs:
  # ── Build and test ────────────────────────────────────────────────────────────────────────
  # Runs for every push and every pull request, so a PR shows its build status before review.
  # Nothing deploys unless this job succeeds, which is what makes a failing test block a release.
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.commit_sha || github.ref }}
          # Full history: the ancestry check below needs more than the tip commit.
          fetch-depth: 0

      # A production rollback may only target something that actually reached main. Without this,
      # the dispatch form would happily deploy an arbitrary unreviewed commit to production.
      - name: Verify rollback SHA is an ancestor of main
        if: >-
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.commit_sha != '' &&
          github.event.inputs.target_environment == 'production'
        run: |
          git fetch origin main
          git merge-base --is-ancestor "${{ github.event.inputs.commit_sha }}" origin/main \
            || { echo "::error::SHA ${{ github.event.inputs.commit_sha }} is not on main"; exit 1; }

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --configuration Release --no-restore

      # Wonrich.Processing.Contracts must stay packable. Publishing is tag-only (publish-contracts.yml).
      - name: Pack contracts (validation)
        run: dotnet pack src/Wonrich.Processing.Contracts/Wonrich.Processing.Contracts.csproj --configuration Release --no-build -o artifacts/packages

      # The suite boots the app through WebApplicationFactory. It needs no database: the health
      # check reports the connection as unhealthy and the test accepts that, so CI stays
      # independent of mcc-db being reachable from a GitHub runner.
      # this step runs the whole suite, including the unit tests in tests/ProcessingService.Tests/Unit
      # (parameterized xUnit tests with NSubstitute doubles). It also collects line coverage as Cobertura
      # (coverage.runsettings) and writes a .trx result file. A failing test fails the job, so nothing deploys.
      - name: Test (unit + API tests, with coverage)
        run: >-
          dotnet test ${{ env.SOLUTION }} --configuration Release --no-build --verbosity normal
          --settings coverage.runsettings --collect:"XPlat Code Coverage"
          --results-directory TestResults --logger "trx;LogFileName=test-results.trx"

      # Readable coverage numbers on the run page (the job summary), built from the Cobertura file.
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('TestResults/**/coverage.cobertura.xml') != '' }}
        run: |
          dotnet tool install dotnet-reportgenerator-globaltool --tool-path ./.tools
          ./.tools/reportgenerator \
            -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:coverage-report \
            -reporttypes:"MarkdownSummaryGithub;Html" \
            -classfilters:"+ProcessingService.Application.*;+ProcessingService.Domain.*"
          cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      # Keep the raw Cobertura file and the HTML report so SonarCloud / Stryker steps (or a person) can use them.
      - name: Upload test results and coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults
            coverage-report
          if-no-files-found: ignore

      - name: Publish
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: dotnet publish ${{ env.PROJECT_PATH }} --configuration Release --no-build -o ${{ github.workspace }}/publish

      # Production does not migrate on startup, so the schema it needs has to travel with the
      # build rather than live only in someone's shell history. --idempotent guards every
      # migration with a check against __EFMigrationsHistory, so the script is safe to run against
      # a database at any point in the history, including one that is already up to date.
      # It is generated, not applied: a GitHub runner has no route through the mcc-db firewall,
      # and that server belongs to another subscription. See docs/ci-cd-pipeline.md.
      - name: Generate idempotent migration script
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          dotnet tool restore
          dotnet ef migrations script --idempotent \
            --project ${{ env.PROJECT_PATH }} \
            --configuration Release --no-build \
            --output ${{ github.workspace }}/migrations/migrations.sql
          echo "generated $(wc -l < ${{ github.workspace }}/migrations/migrations.sql) lines"

      - name: Upload build artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: processing-service
          path: ${{ github.workspace }}/publish

      # A separate artifact, not part of the deployed package: the schema script has no business
      # being served from the application's web root.
      - name: Upload migration script
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: migrations
          path: ${{ github.workspace }}/migrations/migrations.sql

  # code quality and metrics, sonarqube static analysis with our own quality gate
  # runs on every pr and push. sonarqube runs inside this job as a container, fresh every run,
  # so there is no cloud account and nothing to pay. if the gate fails, this job fails and
  # nothing deploys. see quality/README.md
  code-quality:
    name: Code quality (SonarQube)
    needs: build-and-test
    runs-on: ubuntu-latest
    services:
      sonarqube:
        image: sonarqube:26.9.0.129388-community
        ports:
          - 9000:9000
        env:
          SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.commit_sha || github.ref }}
          # full history, so sonarqube can read git blame (who changed each line)
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # sonarqube needs about 1 to 2 minutes to start
      - name: Wait for SonarQube
        run: |
          for _ in $(seq 1 60); do
            curl -fs http://localhost:9000/api/system/status | grep -q '"status":"UP"' && { echo "sonarqube is up"; exit 0; }
            sleep 5
          done
          echo "::error::sonarqube did not start"
          exit 1

      # fresh server, so the login is the default admin / admin. this server only lives for this job
      - name: Create project and token
        run: |
          curl -fs -u admin:admin -X POST "http://localhost:9000/api/projects/create?project=wonrich-processing-service&name=Processing%20Service" > /dev/null
          token=$(curl -fs -u admin:admin -X POST "http://localhost:9000/api/user_tokens/generate?name=ci" | jq -r .token)
          echo "::add-mask::$token"
          echo "SONAR_TOKEN=$token" >> "$GITHUB_ENV"

      # our own gate. the default one only checks new code, and a fresh server never has new code
      - name: Create the quality gate
        shell: pwsh
        run: ./quality/setup-quality-gate.ps1 -Token $env:SONAR_TOKEN

      # same 4 steps as on my pc: begin, build, test with coverage, end
      # sonar.qualitygate.wait makes the end step wait for the gate and fail the job if it fails
      - name: Analyse (begin)
        run: |
          dotnet tool restore
          dotnet sonarscanner begin /k:"wonrich-processing-service" \
            /s:"$GITHUB_WORKSPACE/quality/SonarQube.Analysis.xml" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.qualitygate.wait=true

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --configuration Release --no-incremental

      - name: Test with coverage
        run: >-
          dotnet test ${{ env.SOLUTION }} --configuration Release --no-build
          --settings coverage.runsettings --collect:"XPlat Code Coverage"
          --results-directory TestResults --logger "trx;LogFileName=test-results.trx"

      - name: Analyse (end) and check the quality gate
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      # the results table on the run summary page, also when the gate failed
      - name: Quality summary
        if: ${{ !cancelled() }}
        run: |
          api="http://localhost:9000/api"
          status=$(curl -fs -u "$SONAR_TOKEN:" "$api/qualitygates/project_status?projectKey=wonrich-processing-service") || exit 0
          measures=$(curl -fs -u "$SONAR_TOKEN:" "$api/measures/component?component=wonrich-processing-service&metricKeys=software_quality_security_issues,software_quality_reliability_issues,software_quality_maintainability_issues,coverage,duplicated_lines_density,software_quality_maintainability_remediation_effort,ncloc,tests")
          m() { echo "$measures" | jq -r --arg k "$1" '.component.measures[] | select(.metric==$k) | .value'; }
          {
            echo "## Code quality (SonarQube)"
            echo ""
            echo "**Quality gate: $(echo "$status" | jq -r .projectStatus.status)** (OK = passed, ERROR = failed)"
            echo ""
            echo "| Condition | Actual | Fails when | Result |"
            echo "|---|---|---|---|"
            echo "$status" | jq -r '.projectStatus.conditions[] | "| \(.metricKey) | \(.actualValue) | \(.comparator) \(.errorThreshold) | \(.status) |"'
            echo ""
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Security issues | $(m software_quality_security_issues) |"
            echo "| Reliability issues | $(m software_quality_reliability_issues) |"
            echo "| Maintainability issues (code smells) | $(m software_quality_maintainability_issues) |"
            echo "| Technical debt (minutes) | $(m software_quality_maintainability_remediation_effort) |"
            echo "| Coverage | $(m coverage)% |"
            echo "| Duplications | $(m duplicated_lines_density)% |"
            echo "| Lines of code | $(m ncloc) |"
            echo "| Tests | $(m tests) |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Staging ───────────────────────────────────────────────────────────────────────────────
  # Automatic on every push to develop. No approval: staging exists to be broken in.
  deploy-staging:
    needs: [build-and-test, code-quality]
    if: |
      (github.ref == 'refs/heads/develop' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target_environment == 'staging')
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://app-wonrich-processing-staging.azurewebsites.net
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: processing-service
          path: ./publish

      - name: Deploy to Azure App Service (staging)
        uses: azure/webapps-deploy@v2
        with:
          app-name: app-wonrich-processing-staging
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_STAGING }}
          package: ./publish

      # A deployment that returns 200 but cannot reach its database is a failed deployment; the
      # health endpoint reports the database separately, so check the body rather than the status.
      - name: Verify /health reports healthy
        run: |
          url="https://${{ env.STAGING_APP }}.azurewebsites.net/health"
          for attempt in $(seq 1 30); do
            body=$(curl -fsS --max-time 20 "$url") || body=""
            case "$body" in
              *'"status":"Healthy"'*) echo "$body"; exit 0 ;;
            esac
            echo "attempt $attempt: ${body:-no response}"
            sleep 10
          done
          echo "::error::$url did not report healthy"
          exit 1

  # ── Performance (SE3112 load testing) ─────────────────────────────────────────────────────
  # JMeter load test against staging once it reports healthy. It runs after the deployment, so a
  # performance regression fails the run but never blocks or rolls back what was deployed.
  # Runs the steady `load` profile; stress and spike are run by hand from performance.yml.
  performance:
    needs: deploy-staging
    uses: ./.github/workflows/performance.yml
    secrets: inherit

  # ── End-to-end (SE3112 UI / E2E testing) ──────────────────────────────────────────────────
  # Playwright against staging once it reports healthy: the deployed frontend's processing
  # screens in Chrome, and one delivery through intake, processing, quality-lab and traceability.
  # Like the load test, it runs after the deployment and never blocks or rolls it back.
  e2e:
    needs: deploy-staging
    uses: ./.github/workflows/e2e.yml
    secrets: inherit

  # ── Production ────────────────────────────────────────────────────────────────────────────
  # `environment: production` is what pauses the run for manual approval: the environment created
  # in SCRUM-70 carries a required reviewer and a main-only branch policy. The `if` below is a
  # second line of defence, not the control itself.
  deploy-production:
    needs: [build-and-test, code-quality]
    if: |
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.target_environment == 'production' &&
       github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://app-wonrich-processing-prod.azurewebsites.net
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: processing-service
          path: ./publish

      - name: Deploy to Azure App Service (production)
        uses: azure/webapps-deploy@v2
        with:
          app-name: app-wonrich-processing-prod
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PROD }}
          package: ./publish

      # Production runs with ASPNETCORE_ENVIRONMENT=Production, so it does not apply migrations on
      # startup. A healthy database here means the schema already matches what this build expects.
      - name: Verify /health reports healthy
        run: |
          url="https://${{ env.PRODUCTION_APP }}.azurewebsites.net/health"
          for attempt in $(seq 1 30); do
            body=$(curl -fsS --max-time 20 "$url") || body=""
            case "$body" in
              *'"status":"Healthy"'*) echo "$body"; exit 0 ;;
            esac
            echo "attempt $attempt: ${body:-no response}"
            sleep 10
          done
          echo "::error::$url did not report healthy"
          exit 1