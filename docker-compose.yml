# SCRUM-71 + SCRUM-74 - Isolated MySQL datastore + Processing Service local dev
services:
  mysql:
    image: mysql:8.4
    container_name: wonrich-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: RootPassword123!
      MYSQL_DATABASE: processing
      MYSQL_USER: processing_user
      MYSQL_PASSWORD: DevPassword123!
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "processing_user", "-pDevPassword123!"]
      interval: 10s
      timeout: 5s
      retries: 5

  processing-service:
    build:
      context: .
      dockerfile: src/ProcessingService/Dockerfile
      # Or use root Dockerfile: dockerfile: Dockerfile
    container_name: wonrich-processing
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Server=mysql;Port=3306;Database=processing;User Id=processing_user;Password=DevPassword123!
      Auth__Issuer: wonrich-auth
      Auth__Audience: wonrich-services
      Auth__SigningKey: replace-with-the-shared-signing-key-at-least-32-characters-for-local-dev-only
    ports:
      - "5210:8080"
    # For local dev, service waits for MySQL via healthcheck

volumes:
  mysql_data:
