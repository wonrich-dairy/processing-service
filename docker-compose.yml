# SCRUM-74 - Containerise Processing Service (NEW AC: remote MySQL, no DB container in compose)
# Bring up Processing Service with one command: docker compose up -d
# DB connection via env var pointing at REMOTE MySQL server (SCRUM-71), not containerised
# Config via .env file (gitignored, .env.example committed)

services:
  processing-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wonrich-processing
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Fallback defaults if .env not present - points to remote, not local container
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: ${ASPNETCORE_URLS:-http://+:8080}
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection:-Server=your-remote-mysql-host;Port=3306;Database=processing;User Id=processing_user;Password=your-secure-password}
      Auth__Issuer: ${Auth__Issuer:-wonrich-auth}
      Auth__Audience: ${Auth__Audience:-wonrich-services}
      Auth__SigningKey: ${Auth__SigningKey:-replace-with-the-shared-signing-key-at-least-32-characters}
    ports:
      - "5210:8080"
    # No depends_on mysql - remote DB, not containerised per new AC

  # ── Kafka (SCRUM-88) ───────────────────────────────────────────────────────────────────────
  # Single node in KRaft mode: no ZooKeeper, one container, one volume. Pinned to a patch version,
  # because "latest" would change the broker under a running project without anyone asking.
  kafka:
    image: apache/kafka:3.9.1
    container_name: wonrich-kafka
    restart: unless-stopped
    ports:
      # Only the external listener is published. Anything inside the compose network talks to
      # kafka:9092 instead, which is why the two listeners advertise different host names.
      - "${KAFKA_HOST_PORT:-29092}:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      # A client connects once to learn the broker's advertised address, then reconnects to it.
      # A container resolves "kafka"; the host does not. So the published listener must advertise
      # localhost, or every produce call fails immediately after a successful metadata fetch.
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      # One broker has nowhere to replicate to, so every replication factor must be 1. Staging
      # uses Event Hubs, which handles its own replication.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created deliberately by kafka-init, not conjured into being by a typo in a
      # topic name on the producer side.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-wonrich-local-cluster-0001}
    volumes:
      # This named volume is what makes topic configuration survive a container restart and a
      # machine reboot. `docker compose down -v` is the deliberate way to start clean.
      - wonrich-kafka-data:/var/lib/kafka/data
    healthcheck:
      # Listing topics proves the broker is accepting client connections, not merely that the
      # process is alive - depends_on would otherwise release while the API is still closed.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  # Creates the topics, then exits. Runs on every `up`, which is safe: --if-not-exists leaves an
  # existing topic exactly as it is, so this can never destroy data.
  kafka-init:
    image: apache/kafka:3.9.1
    container_name: wonrich-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infra/kafka:/infra:ro
    entrypoint: ["/bin/bash", "/infra/create-topics.sh"]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
    restart: "no"

volumes:
  wonrich-kafka-data:
