# Alert rules (SCRUM-89).
#
# Committed rather than clicked into the Grafana UI, so they survive a container rebuild and show
# up in review when someone changes what the team gets woken for.

groups:
  - name: wonrich-availability
    rules:
      # The one rule that works today regardless of what the services expose: `up` is synthesised
      # by Prometheus itself from whether the scrape succeeded, so it needs nothing from the
      # application. A service that stops answering is the failure worth catching first.
      #
      # Matched on the `service` label, not a list of jobs (SCRUM-111): a new service is covered the
      # moment it has a scrape job, with no edit here.
      - alert: ServiceDown
        expr: up{service!="prometheus"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} ({{ $labels.environment }}) is not responding to scrapes"
          description: >-
            Prometheus has failed to scrape {{ $labels.service }} at {{ $labels.instance }} for two
            minutes. Either the service is down, or it is up but no longer serving /metrics.

      # Two minutes rather than instantly: an App Service on the Free tier cold-starts, and a
      # single missed scrape during a deployment is not an incident.

  - name: wonrich-errors
    rules:
      # Covers every service following the <service>_http_* naming convention (processing_http_*,
      # quality_lab_http_*) by metric-name pattern, not one expression per service (SCRUM-111).
      # Fires only for services exporting real request metrics: Processing Service's /metrics
      # still returns placeholder zeros (see docs/observability.md).
      - alert: HighErrorRate
        expr: >-
          sum by (service, environment) (rate({__name__=~".+_http_request_errors_total"}[5m]))
          /
          sum by (service, environment) (rate({__name__=~".+_http_requests_total"}[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} is failing more than 5% of requests"
          description: >-
            Over the last five minutes more than 5% of requests to {{ $labels.service }} returned
            an error. Check the service's logs in Loki for the same window.

  # Event-pipeline health (SCRUM-127). The metrics come from kafka-exporter, which reads consumer-group
  # lag and topic offsets from the broker, and from Traceability Service itself. They exist on the
  # staging and production stacks; the local stack has no exporter, so these rules stay quiet there.
  - name: wonrich-event-pipeline
    rules:
      # quality-lab-observability is a passive listener that never commits offsets, so its lag only
      # ever grows and would alert forever. It is left out on purpose.
      - alert: ConsumerLagHigh
        expr: >-
          sum by (consumergroup, environment) (kafka_consumergroup_lag{consumergroup!="quality-lab-observability"}) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Consumer group {{ $labels.consumergroup }} ({{ $labels.environment }}) is falling behind"
          description: >-
            {{ $labels.consumergroup }} has had more than 100 messages waiting for five minutes. The
            consumer is down, stuck, or slower than the producers. Look at its logs and at the lag panel.

      # The offset of a dead-letter topic is how many messages it has ever received, so any increase
      # means a consumer gave up on a message and a person has to look at it.
      - alert: DeadLetterReceived
        expr: >-
          sum by (topic, environment) (increase(kafka_topic_partition_current_offset{topic=~"wonrich[.]dlq[.].+"}[10m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "A message landed in {{ $labels.topic }} ({{ $labels.environment }})"
          description: >-
            A consumer could not process a message in the last ten minutes and parked it on
            {{ $labels.topic }}. Read it from the topic, fix the cause, and replay it.

      # Stale means the newest projected event is more than 15 minutes old while messages are still
      # waiting for the Traceability consumers: the read model is behind, not just quiet.
      - alert: ProjectionStale
        expr: >-
          (time() - max by (environment) (traceability_newest_projected_event_timestamp_seconds)) > 900
          and on (environment)
          sum by (environment) (kafka_consumergroup_lag{consumergroup=~"traceability-.+"}) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Traceability's read model is stale ({{ $labels.environment }})"
          description: >-
            The newest event Traceability has projected is more than 15 minutes old, and its consumer
            groups still have messages waiting. The dashboard no longer shows the factory floor as it is.
