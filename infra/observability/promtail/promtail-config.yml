# Promtail configuration (SCRUM-89) - ships container logs into Loki.
#
# Docker service discovery rather than tailing files: containers come and go, and their log paths
# are container IDs nobody can read. This way a log line arrives already labelled with the
# container's compose service name, which is what you filter on in Grafana.

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  # Where Promtail remembers how far it read. On a volume, so a restart resumes instead of
  # re-shipping every log it can still see.
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s

    relabel_configs:
      # Compose writes these labels onto every container it starts. Using the compose service name
      # as `service` means log labels line up with the `service` label on the metrics, so one
      # variable in Grafana can drive both.
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service

      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: project

      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container

      # Everything Promtail discovers is a container log; the constant label makes the stream
      # selector in a dashboard query simple.
      - target_label: job
        replacement: docker

      # Do not ship the observability stack's own logs into itself. Loki logging about ingesting
      # Loki logs is a loop that only stops when the disk does.
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        regex: '(loki|promtail|prometheus|grafana)'
        action: drop
