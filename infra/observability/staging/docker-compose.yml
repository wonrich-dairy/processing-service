# Staging observability stack (SCRUM-111): Prometheus and Grafana on the shared Kafka VM.
#
# Deployed by infra/observability/staging/deploy.sh, which copies this file, the generated
# prometheus.yml, the shared alert rules and the shared dashboard to ~/observability on the VM.
#
# Both UIs are bound to 127.0.0.1 on the VM: nothing new is opened to the internet. Reach them
# through an SSH tunnel (see docs/observability.md). Prometheus scrapes the App Services over HTTPS.
#
# No Loki or Promtail here: App Service container logs are not files on this VM. Staging logs are
# read in App Service's log stream.
name: wonrich-observability

services:
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: wonrich-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=1GB
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    # The VM also runs the Kafka broker; cap both so neither can starve it.
    mem_limit: 512m

  grafana:
    image: grafana/grafana:11.5.1
    container_name: wonrich-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Generated by deploy.sh into ~/observability/.env on the VM; never committed.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD missing from .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    mem_limit: 256m

  # Event-pipeline health (SCRUM-127). kafka-exporter reads consumer-group lag and topic offsets from a
  # broker and serves them to Prometheus. One per broker, each joined to that broker's Docker network and
  # talking to its internal listener (kafka:9092), so no SASL credentials are involved. Nothing is published.
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: wonrich-kafka-exporter
    restart: unless-stopped
    command: ["--kafka.server=kafka:9092"]
    networks: [default, kafka-staging]
    mem_limit: 64m

  kafka-exporter-prod:
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: wonrich-kafka-exporter-prod
    restart: unless-stopped
    command: ["--kafka.server=kafka:9092"]
    networks: [default, kafka-prod]
    mem_limit: 64m

volumes:
  prometheus-data:
  grafana-data:

networks:
  # The brokers' own compose networks, created by their compose projects in ~/kafka.
  kafka-staging:
    name: wonrich-kafka_default
    external: true
  kafka-prod:
    name: wonrich-kafka-prod_default
    external: true
